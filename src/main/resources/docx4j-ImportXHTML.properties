# Konfiguration für docx4j-ImportXHTML (HTML -> DOCX), wird aus dem Classpath-Root geladen.

# Tabellenzeilen mit <th>-Zellen als Word-Kopfzeilen markieren (<w:tblHeader/>),
# damit sie auf jeder Seite wiederholt werden – Gegenstück zu "-fs-table-paginate" im PDF.
docx4j-ImportXHTML.Tables.th.to.tblHeader=true
